# Comment-only PR reviewer: Claude reviews each new PR and posts one comment
# as qe-pr-reviewer[bot]. The bot's GitHub App can read code and PRs and write
# comments only, so it cannot push, approve or merge.
name: PR review

on:
  pull_request:
    types: [opened, synchronize]   # synchronize = each new push to the PR

# The built-in Actions token gets read-only access; the bot's App token does the commenting.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exchange the App ID and private key for a token that expires in 1 hour.
      # The permission-* lines cap the token here, even if the App is given more later.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QE_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write   # needed to comment on a PR
          permission-issues: read

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, clarity and missing tests.
            Write your review to review.md with the Write tool, then post it with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file review.md`.
            You only recommend: never approve, push or merge.
          claude_args: |
            --allowedTools "Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          # Practice only: shows each tool call in the log. Turn off for private code.
          show_full_output: true

  # Practice test: tries to merge (and push) as the bot with the same token as the reviewer.
  # Both must be refused by GitHub with a permission error. Remove this job once confirmed.
  prove-bot-limits:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QE_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: read

      - name: Bot tries to merge and push (both must be refused for lack of permission)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          failed=0
          # Passes only when GitHub refuses with a permission error, not for any other reason.
          expect_refused() {
            if out=$("$@" 2>&1); then
              echo "::error::The bot was able to: $*"; failed=1
            elif grep -qiE 'not accessible by integration|HTTP 403' <<<"$out"; then
              echo "Refused (no permission), as expected: $*"
            else
              echo "::error::Failed for another reason, so this proves nothing: $out"; failed=1
            fi
          }
          expect_refused gh pr merge "$PR" --squash --repo "$REPO"
          head=$(gh api "repos/$REPO/commits/HEAD" --jq .sha)
          expect_refused gh api "repos/$REPO/git/refs" -f ref="refs/heads/bot-probe-$GITHUB_RUN_ID" -f sha="$head"
          exit $failed
